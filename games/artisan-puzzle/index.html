<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Artisan Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="game-area">
      <div id="hint-bar">구역을 클릭한 채로 드래그하여 도형을 그리세요.</div>
      <canvas id="gameCanvas"></canvas>
    </div>
    <div id="sidebar">
      <div class="panel" id="shapePanel">
        <h3>도형 창고</h3>
        <p class="panel-sub">모든 구역은 아래 형태로 이루어져야 합니다.</p>
        <canvas id="shapeCanvas"></canvas>
        <p id="shapeAlert" class="alert hidden">⚠ 도형이 맞지 않습니다!</p>
      </div>
      <div class="panel">
        <p id="statusMsg"></p>
      </div>
    </div>
  </div>
  <!-- ES module: 로컬 실행 시 Live Server 또는 npx serve 필요 -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
